<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | Wacca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="padding: 60px 20px;">
        <h1 style="color: #0083b0;">お問い合わせ</h1>
        <p>アプリの不具合、サークル掲載依頼、その他ご質問はこちらから承ります。</p>

        <form action="https://formspree.io/f/xaqpobre" method="POST" class="contact-form" style="text-align: left; max-width: 600px; margin: 40px auto;">
            <div class="form-group">
                <label>お名前（ニックネーム可）</label>
                <input type="text" name="name" required placeholder="東大 太郎">
            </div>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" name="_replyto" required placeholder="example@g.ecc.u-tokyo.ac.jp">
            </div>
            <div class="form-group">
                <label>お問い合わせ内容</label>
                <textarea name="message" rows="8" required placeholder="具体的な内容をご記入ください"></textarea>
            </div>
            <button type="submit" class="btn btn-submit">送信する</button>
        </form>
        
        <p style="margin-top: 40px;"><a href="index.html">← トップページへ戻る</a></p>
    </div>
</body>
</html>
