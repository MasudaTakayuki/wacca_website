<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wacca | 東大生のためのサークルマッチング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero">
        <div class="container">
            <h1>Wacca</h1>
            <p class="subtitle">東大生のサークル選びを、もっと自由に。</p>
            <div class="mockup">
                <div class="mockup-placeholder">アプリ画面イメージ</div>
            </div>
            <a href="#" class="btn">アプリをダウンロード（準備中）</a>
        </div>
    </section>

    <section id="contact" class="contact-section">
        <div class="container">
            <h2>お問い合わせ</h2>
            <p>アプリに関するご質問や、サークル掲載依頼はこちらからお送りください。</p>
            
            <form action="https://formspree.io/f/xaqpobre" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">お名前</label>
                    <input type="text" id="name" name="name" required placeholder="東大 太郎">
                </div>
                
                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input type="email" id="email" name="_replyto" required placeholder="example@g.ecc.u-tokyo.ac.jp">
                </div>
                
                <div class="form-group">
                    <label for="message">メッセージ内容</label>
                    <textarea id="message" name="message" rows="5" required placeholder="お問い合わせ内容をご記入ください"></textarea>
                </div>
                
                <button type="submit" class="btn btn-submit">送信する</button>
            </form>
        </div>
    </section>

    <footer>
        <nav>
            <a href="terms.html">利用規約</a> | 
            <a href="privacy.html">プライバシーポリシー</a> | 
            <a href="#contact">お問い合わせ</a>
        </nav>
        <p>&copy; 2026 Wacca Project</p>
    </footer>
</body>
</html>
